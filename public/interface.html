<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interface Traffic</title>
  <link rel="icon" type="image/png" href="/icon-192x192.png">

  <style>
    body {
      font-family: serif;
      background: #fff;
      color: #000;
      margin: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .meta table {
      margin-bottom: 15px;
    }

    .meta td {
      padding: 2px 10px;
      font-size: 16px;
      vertical-align: top;
    }

    .separator {
      border-top: 2px solid #aaa;
      margin: 15px 0;
    }

    .section {
      margin-top: 25px;
    }

    img {
      display: block;
      margin: 10px 0;
      border: 1px solid #999;
      width: 520px;
      max-width: 100%;
    }

    table.stats {
      border-collapse: collapse;
      margin-top: 5px;
    }

    table.stats td {
      padding: 2px 12px;
      font-size: 15px;
      white-space: nowrap;
    }

    .label {
      font-weight: bold;
    }

    /* SAMAKAN WARNA IN & OUT */
    .in {
      color: #00cc00;
      font-weight: normal;
    }

    .out {
      color: #0000cc;
      font-weight: normal;
    }

    .footer {
      margin-top: 40px;
    }

    .info-box {
      background: #f0f0f0;
      border: 1px solid #999;
      border-radius: 4px;
      padding: 12px;
      margin: 15px 0;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<h1 id="title"></h1>

<div class="meta">
  <table>
    <tr><td>System:</td><td><strong id="system">-</strong></td></tr>
    <tr><td>Maintainer:</td><td><strong>mail@taufikcrisnawan.dev</strong></td></tr>
    <tr><td>Description:</td><td><strong id="desc"></strong></td></tr>
    <tr><td>ifType:</td><td id="iftype">-</td></tr>
    <tr><td>ifName:</td><td id="ifname">-</td></tr>
    <tr><td>MTU:</td><td id="ifmtu">-</td></tr>
    <tr><td>Max Speed:</td><td id="speedrate">—</td></tr>
    <tr><td>Ip:</td><td id="ip">-</td></tr>
  </table>
</div>

<div class="separator"></div>

<div class="info-box" id="infobox">
  <strong id="info-text">Loading system information...</strong>
</div>

<div id="content"></div>

<div class="footer">
  <a href="index.html">← Return to Home</a>
</div>

<!-- ================= SCRIPT ================= -->

<script type="module">
import { INTERFACES } from './config.js';

const iface = new URLSearchParams(location.search).get("iface") || "unknown";

document.title = `TFK - ${iface}`;
document.getElementById("title").textContent = iface; // Will be updated with description after API fetch
document.getElementById("ifname").textContent = iface;
document.getElementById("desc").textContent = iface;
document.getElementById("system").textContent = "NMS in TFK HOME-YGK";

// Load interface data from config
const ifaceData = INTERFACES[iface];
if (ifaceData) {
  document.getElementById("ip").textContent = ifaceData.ip || "-";
  document.getElementById("desc").textContent = ifaceData.description || iface;
  document.getElementById("speedrate").textContent = ifaceData.maxSpeed || "-";
}

// Enrich with SNMP-discovered metadata when available
fetch("/api/interfaces/detailed")
  .then((res) => res.json())
  .then((interfaces) => {
    const current = Array.isArray(interfaces)
      ? interfaces.find((x) => x.ifName === iface)
      : null;
    if (!current) return;

    // Display description as title (in uppercase)
    if (current.interfaceDescription) {
      const descTitle = current.interfaceDescription.toUpperCase();
      document.getElementById("title").textContent = descTitle;
      document.title = `TFK - ${descTitle}`;
      document.getElementById("desc").textContent = current.interfaceDescription;
    }

    // Display ifType
    if (current.ifType) {
      document.getElementById("iftype").textContent = current.ifType;
    }

    // Display MTU
    if (current.ifMtu) {
      document.getElementById("ifmtu").textContent = current.ifMtu;
    }

    if (current.speedrate) {
      document.getElementById("speedrate").textContent = current.speedrate;
    }
  })
  .catch(() => {});

// Lazy-load system info (don't block main content)
function loadSystemInfo() {
  Promise.all([
    fetch("/api/system/info").then((res) => res.json()).catch(() => ({})),
    fetch(`/api/rrd/lastupdate/${encodeURIComponent(iface)}`).then((res) => res.json()).catch(() => ({}))
  ]).then(([sysInfo, rrdInfo]) => {
    // Format uptime
    function formatUptime(centiseconds) {
      const totalSeconds = Math.floor(centiseconds / 100);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return `${days} days, ${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // Format last update
    function formatDateTime(timestamp) {
      if (!timestamp) return "N/A";
      const date = new Date(timestamp);
      const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      
      const day = dayNames[date.getDay()];
      const month = monthNames[date.getMonth()];
      const dateNum = date.getDate();
      const year = date.getFullYear();
      const time = String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
      
      return `${day}, ${dateNum} ${month} ${year} at ${time}`;
    }

    const sysName = sysInfo.sysName || "router";
    const uptime = sysInfo.sysUpTime ? formatUptime(sysInfo.sysUpTime) : "N/A";
    const lastUpdate = formatDateTime(rrdInfo.timestamp);

    const infoText = `The statistics were last updated ${lastUpdate}, at which time '<strong>${sysName}</strong>' had been up for <strong>${uptime}</strong>.`;
    document.getElementById("info-text").innerHTML = infoText;
  }).catch(() => {});
}

// Load system info after 500ms (let main content render first)
setTimeout(loadSystemInfo, 500);

const sections = [
  ["daily",   "Daily Graph (5 Minute Average)"],
  ["weekly",  "Weekly Graph (30 Minute Average)"],
  ["monthly", "Monthly Graph (2 Hour Average)"],
  ["yearly",  "Yearly Graph (1 Day Average)"]
];

function graphUrl(type) {
  return `/api/iface/${encodeURIComponent(iface)}/graph/${type}`;
}

function toMbpsText(value) {
  const n = Number(value || 0);
  const mbps = n / 1000000;
  if (!Number.isFinite(mbps)) return "-";
  if (mbps >= 1) return `${mbps.toFixed(1)} Mb/s`;
  return `${(mbps * 1000).toFixed(1)} kb/s`;
}

async function load() {
  const res = await fetch(`/api/iface/${encodeURIComponent(iface)}/stats`);
  const stats = await res.json();

  const root = document.getElementById("content");
  root.innerHTML = "";

  sections.forEach(([key, title]) => {
    const s = stats[key];
    if (!s) return;

    const div = document.createElement("div");
    div.className = "section";

    div.innerHTML = `
      <h2>${title}</h2>
      <img src="${graphUrl(key)}">
      <table class="stats">
        <tr>
          <td></td>
          <td><strong>Max</strong></td>
          <td><strong>Average</strong></td>
          <td><strong>Current</strong></td>
        </tr>
        <tr>
          <td class="label in">In</td>
          <td>Max ${toMbpsText(s.in?.max)}</td>
          <td>Avg ${toMbpsText(s.in?.avg)}</td>
          <td>Cur ${toMbpsText(s.in?.current)}</td>
        </tr>
        <tr>
          <td class="label out">Out</td>
          <td>Max ${toMbpsText(s.out?.max)}</td>
          <td>Avg ${toMbpsText(s.out?.avg)}</td>
          <td>Cur ${toMbpsText(s.out?.current)}</td>
        </tr>
      </table>
    `;

    root.appendChild(div);
  });
}

load();
</script>

</body>
</html>
